  interests:
    - title: 哈密尔顿图论
      text: 哈密尔顿圈与路、哈密尔顿连通性，以及与度、连通度和支配有关的充分条件。
      keywords: [圈与路, 度条件, 连通度]
    - title: 极值图论
      text: 涉及圈、路、匹配和线性森林的极值问题，包括边数与团数的最优界及极值图的刻画。
      keywords: [最优界, 极值图]
    - title: 结构图论
      text: 图的连通性、顶点割和局部结构，重点关注无爪图，以及图和 3-超图的线图。
      keywords: [无爪图, 线图, 3-超图]
