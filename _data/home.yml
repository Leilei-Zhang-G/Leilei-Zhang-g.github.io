  interests:
    - title: Hamiltonian graph theory
      text: Hamiltonian cycles and paths, Hamiltonian-connectedness, and sufficient conditions involving degree, connectivity, and domination.
      keywords: [Cycles and paths, Degree conditions, Connectivity]
    - title: Extremal graph theory
      text: Extremal problems involving cycles, paths, matchings, and linear forests, including sharp bounds on the number of edges and cliques and the characterization of extremal graphs.
      keywords: [Sharp bounds, Extremal graphs]
    - title: Structural graph theory
      text: Graph connectivity, vertex cuts, and local structure, with particular interest in claw-free graphs and line graphs of graphs and 3-hypergraphs.
      keywords: [Claw-free graphs, Line graphs, 3-hypergraphs]
