  interests:
    - title: Hamiltonian graph theory
      text: Hamiltonian cycles and paths, Hamiltonian-connectedness, and sufficient conditions involving degree, connectivity, and domination.
      keywords: [Cycles and paths, Degree conditions, Connectivity]
